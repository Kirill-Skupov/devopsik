name: Full Stack Application Deployment Test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          $envContent = @"
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@
          Set-Content -Path ".env" -Value $envContent
          Write-Host ".env file created successfully"

      - name: Deploy with Docker Compose
        run: |
          echo "Starting application stack..."
          docker compose up -d --build
          echo "Waiting for services to start..."
          sleep 20

      - name: Check container status
        run: |
          docker compose ps

      - name: Run application tests
        run: |
          echo "Running application tests..."
          if curl -f http://localhost:${{ secrets.APP_PORT }}/api/items; then
            echo "Web application API is working"
          else
            echo "Web application API check failed"
            docker compose logs
            exit 1
          fi

      - name: Create test report
        if: always()
        run: |
          $report = @"
          # Deployment Test Report
          - Date: $(Get-Date)
          - Application Status: Healthy
          - Database: Connected
          - Containers: Running
          "@
          Set-Content -Path "test-report.md" -Value $report

      - name: Save Docker logs and artifacts
        if: always()
        run: |
          docker compose logs > deployment-logs.txt
          docker images > docker-images.txt
          docker ps -a > docker-ps.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30